<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>timers demo</title>
<style>
body { font-family: sans-serif; font-size: 15px; margin: 0; padding: 20px; background: #f7f8fa; }
h2 { color: #2b3a55; }
p { margin: 8px 0; }
.box { background: #ffffff; border: 1px solid #d6dae2; padding: 10px 14px; margin-bottom: 12px; }
.ok { color: #2f9e63; font-weight: bold; }
.item { background: #eef2ff; padding: 4px 8px; margin: 4px 0; }
.item.sel { background: #ffd9a0; }
</style>
</head>
<body>
<h2>Timers &amp; querySelector</h2>
<div class="box">
  <p id="timeout-msg">waiting for setTimeout...</p>
  <p id="interval-msg" class="ok">interval: 0</p>
  <p id="raf-msg">raf frames: 0</p>
</div>
<div class="box">
  <p>querySelectorAll found: <span id="qsa-count">?</span> items; first via querySelector:
  <span id="qsa-first">?</span></p>
  <div class="item">alpha</div>
  <div class="item">beta</div>
  <div class="item sel">gamma</div>
</div>
<script>
var count = 0;
setTimeout(function () {
  var el = document.getElementById("timeout-msg");
  el.textContent = "setTimeout fired!";
  el.style.color = "#2f9e63";
}, 120);

var iv = setInterval(function () {
  count++;
  document.getElementById("interval-msg").textContent = "interval: " + count;
  if (count >= 100) clearInterval(iv);
}, 100);

var frames = 0;
function rafLoop() {
  frames++;
  document.getElementById("raf-msg").textContent = "raf frames: " + frames;
  if (frames < 1000)
    requestAnimationFrame(rafLoop);
}
requestAnimationFrame(rafLoop);

var items = document.querySelectorAll(".item");
document.getElementById("qsa-count").textContent = "" + items.length;
var first = document.querySelector("div.item");
document.getElementById("qsa-first").textContent = first ? first.textContent : "none";
</script>
</body>
</html>
