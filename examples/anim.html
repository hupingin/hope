<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>anim</title>
<style>
/* CSS transitions + @keyframes interpolation clock demo / regression page.
 * Headless assertions use HOPE_TEST_TICKS + HOPE_TEST_ANIM_STEP (a
 * deterministic clock): N ticks x STEP seconds equals the animation time. */
@keyframes fade {
  from { opacity: 0.2; }
  to   { opacity: 0.8; }
}
@keyframes slide {
  from { margin-left: 0px; }
  to   { margin-left: 100px; }
}
#kf {
  width: 50px; height: 50px;
  background-color: rgb(200, 0, 0);
  /* 2 iterations, alternate direction, fill both */
  animation: fade 1s linear 2 alternate both;
}
#slide {
  width: 20px; height: 20px;
  background-color: rgb(0, 0, 200);
  animation: slide 2s linear 1 normal none;
}
#tr {
  width: 100px; height: 10px;
  background-color: rgb(0, 200, 0);
  transition: width 1s linear;
}
#steps {
  width: 10px; height: 10px;
  background-color: rgb(80, 80, 80);
  animation: fade 1s steps(4, end) 1 normal none;
}
</style>
</head>
<body>
<div id="kf"></div>
<div id="slide"></div>
<div id="tr"></div>
<div id="steps"></div>
<script>
/* starts a width transition on #tr: 100px -> 200px over 1s */
document.getElementById("tr").style.width = "200px";
document.title = "anim-loaded";
</script>
</body>
</html>
