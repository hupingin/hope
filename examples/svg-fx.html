<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>SVG clipPath / mask / marker / filter</title>
<style>
  body { margin: 0; padding: 12px; font-family: sans-serif; font-size: 12px;
         color: #222222; background-color: #ffffff; }
  svg { display: block; margin-bottom: 8px; }
</style>
</head>
<body>
  <!-- 1. clipPath: circle clip on a rect; group-level clip -->
  <svg width="360" height="80" viewBox="0 0 360 80">
    <defs>
      <clipPath id="cp1"><circle cx="50" cy="40" r="32"/></clipPath>
      <clipPath id="cp2"><rect x="130" y="10" width="90" height="60"/></clipPath>
    </defs>
    <rect x="10" y="10" width="80" height="60" fill="#1a73e8" clip-path="url(#cp1)"/>
    <g clip-path="url(#cp2)">
      <rect x="150" y="30" width="90" height="60" fill="#d93025"/>
      <circle cx="145" cy="20" r="25" fill="#188038"/>
    </g>
    <text x="250" y="45" font-size="16" fill="#7b1fa2"
          clip-path="url(#cp2)">clipped</text>
  </svg>

  <!-- 2. mask: luminance mask fades a rect; radial mask -->
  <svg width="360" height="80" viewBox="0 0 360 80">
    <defs>
      <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="1" stop-color="#000000"/>
      </linearGradient>
      <mask id="m1"><rect x="10" y="10" width="100" height="60" fill="url(#fade)"/></mask>
      <radialGradient id="spot">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset="1" stop-color="#000000"/>
      </radialGradient>
      <mask id="m2"><rect x="130" y="10" width="100" height="60" fill="url(#spot)"/></mask>
    </defs>
    <rect x="10" y="10" width="100" height="60" fill="#1a73e8" mask="url(#m1)"/>
    <rect x="130" y="10" width="100" height="60" fill="#d93025" mask="url(#m2)"/>
    <rect x="250" y="10" width="100" height="60" fill="#188038"/>
  </svg>

  <!-- 3. marker: arrowheads on a path and a polyline -->
  <svg width="360" height="90" viewBox="0 0 360 90">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3"
              orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L8,3 L0,6 Z" fill="#d93025"/>
      </marker>
    </defs>
    <path d="M20 60 L120 30 L220 60" fill="none" stroke="#222222" stroke-width="2"
          marker-start="url(#arrow)" marker-mid="url(#arrow)" marker-end="url(#arrow)"/>
    <polyline points="40,80 200,80 320,20" fill="none" stroke="#1a73e8"
              stroke-width="3" marker-end="url(#arrow)"/>
  </svg>

  <!-- 4. filter: feGaussianBlur on a rect; blur + feOffset -->
  <svg width="360" height="90" viewBox="0 0 360 90">
    <defs>
      <filter id="blur2"><feGaussianBlur stdDeviation="2"/></filter>
      <filter id="blur5off">
        <feGaussianBlur stdDeviation="5"/><feOffset dx="12" dy="6"/>
      </filter>
    </defs>
    <rect x="20" y="20" width="90" height="50" fill="#1a73e8" filter="url(#blur2)"/>
    <rect x="140" y="20" width="90" height="50" fill="#d93025" filter="url(#blur5off)"/>
    <rect x="260" y="20" width="90" height="50" fill="#188038"/>
  </svg>
</body>
</html>
