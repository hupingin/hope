<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>grid layout</title>
<style>
  body { margin: 8px; font-family: sans-serif; font-size: 11px; }
  .g { display: grid; margin-bottom: 14px; }
  .g > div { border: 1px solid #333; padding: 2px; }

  /* 1. fixed + fraction tracks */
  .fixed-fr { grid-template-columns: 60px 1fr 2fr; grid-gap: 6px; width: 320px; }

  /* 2. repeat() and percentage tracks */
  .repeated { grid-template-columns: repeat(4, 1fr); grid-gap: 4px; width: 320px; }

  /* 3. spans: a header across two columns and a tall cell down two rows */
  .spanned { grid-template-columns: repeat(3, 70px); grid-gap: 4px; width: 240px; }
  .spanned .head { grid-column: 1 / 3; background: #f6d5d5; }
  .spanned .tall { grid-row: 1 / 3; grid-column: 3; background: #d5e8f6; }
  .spanned .a { background: #d9f2d9; }
  .spanned .b { background: #f6f2d5; }

  /* 4. auto rows wrap when there are more items than columns */
  .wrap { grid-template-columns: repeat(3, 1fr); grid-gap: 4px; width: 240px; }
  .wrap .alt { background: #eee; }

  /* 5. auto-flow column fills down the columns instead of across the rows */
  .flowcol { grid-template-columns: repeat(3, 40px); grid-template-rows: repeat(2, 20px);
             grid-auto-flow: column; grid-gap: 4px; }
  .flowcol .hi { background: #e8d5f6; }
</style>
</head>
<body>

<div class="g fixed-fr">
  <div>60px</div><div>1fr</div><div>2fr</div>
</div>

<div class="g repeated">
  <div>a</div><div>b</div><div>c</div><div>d</div>
  <div>e</div><div>f</div><div>g</div><div>h</div>
</div>

<div class="g spanned">
  <div class="head">col 1-2</div>
  <div class="tall">row 1-2<br>col 3</div>
  <div class="a">a</div>
  <div class="b">b</div>
</div>

<div class="g wrap">
  <div class="alt">1</div><div>2</div><div class="alt">3</div>
  <div>4</div><div class="alt">5</div><div>6</div>
</div>

<div class="g flowcol">
  <div class="hi">c1</div><div>c2</div><div>c3</div>
  <div class="hi">c4</div><div>c5</div><div>c6</div>
</div>

</body>
</html>
