<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Hope Engine - modern JS</title>
  <style>
    body {
      margin: 0;
      background-color: #f5f6f8;
      color: #202124;
      font-size: 15px;
      line-height: 1.55;
      font-family: sans-serif;
    }
    .page { width: 720px; margin: 24px auto; }
    h1 { font-size: 26px; margin: 0 0 6px 0; color: #14213d; }
    .subtitle { color: #5f6368; font-size: 13px; margin: 0 0 18px 0; }
    .card {
      background-color: #ffffff;
      border: 1px solid #dcdfe4;
      padding: 12px 18px;
      margin: 0 0 14px 0;
    }
    .card h2 { font-size: 16px; margin: 0 0 8px 0; color: #1a73e8; }
    .row { font-family: monospace; font-size: 13px; white-space: pre; }
    .fail { color: #d93025; font-weight: bold; }
    .ok { color: #188038; }
  </style>
</head>
<body>
  <div class="page">
    <h1>Modern JavaScript</h1>
    <p class="subtitle">try/catch &middot; class/extends/super &middot; this + call/apply/bind &middot; destructuring &middot; spread/rest &middot; template literals &middot; labels &middot; optional chaining &middot; getters &middot; regex &middot; Promise/async &middot; generators &middot; Set/Map</p>
    <div class="card"><h2>Results</h2><div id="out"></div></div>
  </div>
<script>
  var lines = [];
  function check(label, got, want) {
    var pass = String(got) === String(want);
    lines.push((pass ? "  ok   " : "  FAIL ") + label + " = " + got + (pass ? "" : "   (want " + want + ")"));
    return pass;
  }
  var passCount = 0, total = 0;

  // ---- 1. try / catch / finally / throw / Error ----
  var caught = "";
  try { throw new Error("kaboom"); } catch (e) { caught = e.name + ":" + e.message; }
  total++; if (check("throw/catch Error", caught, "Error:kaboom")) passCount++;
  var fin = [];
  try { fin.push("t"); } finally { fin.push("f"); }
  total++; if (check("finally runs", fin.join(""), "tf")) passCount++;
  total++; if (check("instanceof TypeError",
        (function () { try { throw new TypeError("x"); } catch (e) { return e instanceof TypeError && e instanceof Error; } })(),
        "true")) passCount++;

  // ---- 2. class / extends / super / instanceof / getter+setter ----
  class Animal {
    constructor(name) { this.name = name; }
    speak() { return this.name + " makes a sound"; }
    get kind() { return "animal"; }
  }
  class Dog extends Animal {
    constructor(name, breed) { super(name); this.breed = breed; }
    speak() { return super.speak() + " (woof)"; }
    get kind() { return "dog:" + this.breed; }
    set kind(v) { this.breed = v; }
    static create(n) { return new Dog(n, "mutt"); }
  }
  var d = new Dog("Rex", "lab");
  total++; if (check("super.speak", d.speak(), "Rex makes a sound (woof)")) passCount++;
  total++; if (check("instanceof both", d instanceof Dog && d instanceof Animal, "true")) passCount++;
  total++; if (check("getter override", d.kind, "dog:lab")) passCount++;
  d.kind = "pug";
  total++; if (check("setter", d.breed, "pug")) passCount++;
  total++; if (check("static method", Dog.create("Zip") instanceof Dog, "true")) passCount++;

  // ---- 3. this / call / apply / bind / arrow capture ----
  var o = { v: 42, get() { return this.v; } };
  var det = o.get;
  total++; if (check("call/apply/bind", det.call(o) + "," + o.get.apply(o) + "," + o.get.bind(o)(), "42,42,42")) passCount++;
  var ctr = { n: 0, inc() { this.n++; return this.n; } };
  var b = ctr.inc.bind(ctr);
  b(); b();
  total++; if (check("bound this", ctr.n, 2)) passCount++;
  var holder = { n: 7, make() { return () => this.n; } };
  total++; if (check("arrow captures this", holder.make()(), 7)) passCount++;

  // ---- 4. destructuring / spread / default / rest / template ----
  var [a1, , a3 = 9, ...restA] = [1, 2, undefined, 4, 5];
  total++; if (check("array destructure", a1 + "|" + a3 + "|" + restA.join(","), "1|9|4,5")) passCount++;
  var { p, q: alias = "dq", ...restO } = { p: 1, x: 2, y: 3 };
  total++; if (check("object destructure", p + "|" + alias + "|" + JSON.stringify(restO), '1|dq|{"x":2,"y":3}')) passCount++;
  function defs(x = 10, ...more) { return x + "/" + more.length; }
  total++; if (check("default + rest params", defs() + " " + defs(1, 2, 3), "10/0 1/2")) passCount++;
  var sp = [0, ...[1, 2], 3];
  total++; if (check("spread + Math.max", sp.join(",") + " " + Math.max(...sp), "0,1,2,3 3")) passCount++;
  var who = "world";
  total++; if (check("template literal", `hi ${who} ${1 + 1} ${`in${""}ner`}`, "hi world 2 inner")) passCount++;

  // ---- 5. for-in / for-of / switch / labels / bitwise / optional ----
  var ks = []; for (var k in { a: 1, b: 2 }) ks.push(k);
  total++; if (check("for-in keys", ks.join(","), "a,b")) passCount++;
  var vs = []; for (var v of [10, 20, 30]) vs.push(v);
  total++; if (check("for-of values", vs.join(","), "10,20,30")) passCount++;
  var cs = []; for (var c of "abc") cs.push(c);
  total++; if (check("for-of string (utf8)", cs.join(","), "a,b,c")) passCount++;
  function sw(x) { switch (x) { case 1: return "one"; case 2: case 3: return "mid"; default: return "other"; } }
  total++; if (check("switch fallthrough", sw(1) + sw(2) + sw(3) + sw(9), "onemidmidother")) passCount++;
  var sum = 0;
  outer:
  for (var i = 0; i < 3; i++) {
    for (var j = 0; j < 3; j++) {
      if (j === 2) continue outer;
      sum += i * 10 + j;
    }
  }
  total++; if (check("continue <label>", sum, 63)) passCount++;
  var walked = [];
  brk:
  for (var i2 = 0; i2 < 3; i2++) {
    for (var j2 = 0; j2 < 3; j2++) {
      if (i2 === 1 && j2 === 1) break brk;
      walked.push(i2 + "" + j2);
    }
  }
  total++; if (check("break <label>", walked.join(","), "00,01,02,10")) passCount++;
  total++; if (check("bitwise", [5 & 3, 5 | 3, 5 ^ 3, ~5, 1 << 4, -16 >> 2, -16 >>> 28].join(","),
        "1,7,6,-6,16,-4,15")) passCount++;
  var opt = { a: { b: { c: 5 } } };
  total++; if (check("?. and ??", opt?.a?.b?.c + " " + (opt?.z?.b ?? "fb") + " " + (0 ?? 1), "5 fb 0")) passCount++;

  // ---- 6. regex literals / capturing groups / flags ----
  total++; if (check("regex test + group", /a(b+)c/.test("abbbc") + " " + "abc".match(/a(b+)c/)[1], "true b")) passCount++;
  total++; if (check("regex replace $n", "2024-01-02".replace(/(\d+)-(\d+)-(\d+)/, "$3/$2/$1"), "02/01/2024")) passCount++;
  total++; if (check("regex global + split", "aaa".replace(/a/g, "b") + " " + "a1b22c".split(/\d+/).join("|"), "bbb a|b|c")) passCount++;
  total++; if (check("lookaround + \\b", /x(?=y)/.test("xy") + " " + /(?<=a)b/.test("ab") + " " + /\bcat\b/.test("a cat!"), "true true true")) passCount++;

  // ---- 6b. named capture groups / u y d flags / \p{...} ----
  var named = /(?<year>\d{4})-(?<month>\d{2})/.exec("2026-11");
  total++; if (check("named group index", named[1] + " " + named[2], "2026 11")) passCount++;
  total++; if (check("groups object", named.groups.year + " " + named.groups.month, "2026 11")) passCount++;
  total++; if (check("unnamed groups undefined", /(\d)/.exec("7").groups === undefined, "true")) passCount++;
  total++; if (check("named group in match()", "2026-11".match(/(?<y>\d{4})/).groups.y, "2026")) passCount++;
  var sticky = /ab/y;
  sticky.lastIndex = 2;
  total++; if (check("sticky matches at lastIndex", sticky.exec("abab")[0], "ab")) passCount++;
  total++; if (check("sticky does not slide", /ab/y.exec("xxab"), "null")) passCount++;
  var idx = /(?<n>\d+)/d.exec("ab123");
  total++; if (check("d flag whole indices", idx.indices[0].join(","), "2,5")) passCount++;
  total++; if (check("d flag group indices", idx.indices[1].join(","), "2,5")) passCount++;
  total++; if (check("d flag named indices", idx.indices.groups.n.join(","), "2,5")) passCount++;
  total++; if (check("no indices without d", /\d/.exec("1").indices === undefined, "true")) passCount++;
  total++; if (check("u flag accepted", /\d+/u.exec("ab42")[0], "42")) passCount++;
  total++; if (check("\\p{L} letters", /\p{L}+/.exec("42abc")[0], "abc")) passCount++;
  total++; if (check("\\p{L} cjk", /\p{L}+/.exec("你好 x")[0], "你好")) passCount++;
  total++; if (check("\\p{Nd} digits", /\p{Nd}+/.exec("ab42")[0], "42")) passCount++;
  total++; if (check("\\P{L} complement", /\P{L}+/.exec("ab12")[0], "12")) passCount++;
  total++; if (check("\\p{} inside class", /[\p{Nd}]+/.exec("x7y8")[0], "7")) passCount++;

  // ---- 7. Promise / async await / generator ----
  var order = [];
  Promise.resolve(1).then(function (x) { order.push("p" + x); return x + 1; }).then(function (x) { order.push("p" + x); });
  async function asyncAdd(x, y) { var r = await Promise.resolve(x + y); return r * 2; }
  asyncAdd(3, 4).then(function (x) { order.push("a" + x); });
  total++; if (check("promise chain + await", order.join(","), "p1,p2,a14")) passCount++;
  function* gen() { yield 1; yield 2; yield 3; }
  total++; if (check("generator", [...gen()].join(","), "1,2,3")) passCount++;

  // ---- 8. Set / Map / private fields ----
  var st = new Set([1, 2, 2, 3]);
  st.add(4);
  total++; if (check("Set dedup", st.size + " " + st.has(2) + " " + [...st.values()].join(","), "4 true 1,2,3,4")) passCount++;
  var mp = new Map([["a", 1]]);
  mp.set("b", 2);
  total++; if (check("Map", mp.size + " " + mp.get("a") + " " + mp.has("b"), "2 1 true")) passCount++;
  class Priv { #n = 0; bump() { this.#n = this.#n + 1; return this.#n; } }
  var pr = new Priv();
  total++; if (check("private field #n", pr.bump() + "," + pr.bump(), "1,2")) passCount++;

  // ---- 8b. Proxy / Reflect ----
  var plog = [];
  var pt = new Proxy({ a: 1 }, {
    get: function (t, k) { plog.push("g" + k); return k === "ghost" ? 7 : t[k]; },
    set: function (t, k, v) { plog.push("s" + k); t[k] = v * 2; return true; },
    has: function (t, k) { return k === "hidden" ? true : k in t; }
  });
  pt.b = 5;
  total++; if (check("proxy set trap", pt.a + " " + pt.b, "1 10")) passCount++;
  total++; if (check("proxy get trap default", pt.ghost, "7")) passCount++;
  total++; if (check("proxy has trap", ("hidden" in pt) + " " + ("nope" in pt), "true false")) passCount++;
  total++; if (check("proxy traps ran", plog.join(","), "sb,ga,gb,gghost")) passCount++;
  var rk = Reflect.ownKeys({ z: 1, y: 2 }).sort().join(",");
  total++; if (check("Reflect.ownKeys", rk, "y,z")) passCount++;
  total++; if (check("Reflect.apply", Reflect.apply(Math.max, null, [2, 9, 4]), "9")) passCount++;
  var rp = Reflect.construct(function (x, y) { this.s = x + y; }.bind(null), [3, 4]);
  total++; if (check("Reflect.construct", rp.s, "7")) passCount++;
  total++; if (check("Reflect.getOwnPropertyDescriptor", Reflect.getOwnPropertyDescriptor({ q: 3 }, "q").value, "3")) passCount++;

  // ---- 8c. escape / unescape ----
  total++; if (check("escape space + tilde", escape("a b~"), "a%20b%7E")) passCount++;
  total++; if (check("escape cjk", escape("中"), "%u4E2D")) passCount++;
  total++; if (check("unescape %u", unescape("%u4E2D%u6587"), "中文")) passCount++;
  total++; if (check("unescape roundtrip astral", unescape(escape("😀")) === "😀", "true")) passCount++;

  // ---- 8d. Intl ----
  var nf = new Intl.NumberFormat("en-US");
  total++; if (check("NumberFormat grouping", nf.format(1234567), "1,234,567")) passCount++;
  var nf2 = new Intl.NumberFormat("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  total++; if (check("NumberFormat fixed 2", nf2.format(1234.5), "1,234.50")) passCount++;
  var cf = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
  total++; if (check("NumberFormat currency", cf.format(12.5), "$12.50")) passCount++;
  var df = new Intl.DateTimeFormat("en-US", { timeZone: "UTC" });
  total++; if (check("DateTimeFormat date", df.format(new Date(Date.UTC(2026, 10, 25))), "11/25/2026")) passCount++;
  var co = new Intl.Collator("en-US");
  total++; if (check("Collator compare", co.compare("a", "b") < 0 && co.compare("b", "a") > 0, "true")) passCount++;

  // ---- 8e. WeakMap / WeakSet / WeakRef ----
  var wk = new WeakMap();
  var wkobj = {};
  wk.set(wkobj, 42);
  total++; if (check("WeakMap get/set/has", wk.get(wkobj) + " " + wk.has(wkobj) + " " + wk.has({}), "42 true false")) passCount++;
  total++; if (check("WeakMap delete", wk.delete(wkobj) + " " + wk.has(wkobj), "true false")) passCount++;
  var ws = new WeakSet();
  ws.add(wkobj);
  total++; if (check("WeakSet add/has", ws.has(wkobj) + " " + ws.has({}), "true false")) passCount++;
  total++; if (check("WeakRef deref", new WeakRef(wkobj).deref() === wkobj, "true")) passCount++;

  // ---- 8f. Map/Set 惰性迭代器 ----
  var lm = new Map([["a", 1], ["b", 2]]);
  var lit = lm.entries();
  lit.next();
  total++; if (check("Map iterator next", lit.next().value.join(":"), "b:2")) passCount++;
  total++; if (check("iterator spread", [...lm.keys()].join(","), "a,b")) passCount++;
  var ls = new Set([7, 8, 9]);
  total++; if (check("Set spread", [...ls].join(","), "7,8,9")) passCount++;
  var si = ls.values();
  si.next();
  total++; if (check("iterator resumes mid-way", [...si].join(","), "8,9")) passCount++;
  total++; if (check("Set entries pairs", [...ls.entries()].map(function (p) { return p.join("/"); }).join(","), "7/7,8/8,9/9")) passCount++;

  // ---- 8g. BigInt ----
  total++; if (check("BigInt typeof", typeof 10n, "bigint")) passCount++;
  total++; if (check("BigInt add/mul", (10n + 20n) + " " + (6n * 7n), "30 42")) passCount++;
  total++; if (check("BigInt toString radix", (255n).toString(16), "ff")) passCount++;
  total++; if (check("BigInt compare", (5n < 10n) + " " + (5n === 5n), "true true")) passCount++;
  total++; if (check("BigInt.asIntN", BigInt.asIntN(8, 255n), "-1")) passCount++;

  // ---- 8h. ArrayBuffer / TypedArray / DataView ----
  var abuf = new ArrayBuffer(16);
  total++; if (check("ArrayBuffer byteLength", abuf.byteLength, "16")) passCount++;
  var au8 = new Uint8Array(abuf);
  au8[0] = 255; au8[1] = 128;
  total++; if (check("Uint8Array write", au8[0] + " " + au8[1] + " " + au8.length, "255 128 16")) passCount++;
  total++; if (check("Uint8Array truncates", (function () { var x = new Uint8Array(1); x[0] = 1.7; return x[0]; })(), "1")) passCount++;
  var ai16 = new Int16Array([1, -2, 3]);
  total++; if (check("Int16Array from array", ai16.length + " " + ai16[1], "3 -2")) passCount++;
  var af64 = new Float64Array([1.5, 2.25]);
  total++; if (check("Float64Array", (af64[0] + af64[1]), "3.75")) passCount++;
  total++; if (check("TypedArray.subarray", new Uint8Array([1, 2, 3, 4]).subarray(1, 3).join(","), "2,3")) passCount++;
  total++; if (check("TypedArray.set", (function () {
    var a = new Uint8Array(4); a.set([9, 8], 1); return a.join(",");
  })(), "0,9,8,0")) passCount++;
  total++; if (check("view aliases buffer", (function () {
    var b = new ArrayBuffer(4), v = new Uint8Array(b); v[0] = 7; return new Uint8Array(b)[0];
  })(), "7")) passCount++;
  var adv = new DataView(new ArrayBuffer(8));
  adv.setInt32(0, 0x01020304);
  total++; if (check("DataView getInt32", adv.getInt32(0), "16909060")) passCount++;
  adv.setUint8(4, 200);
  total++; if (check("DataView getUint8", adv.getUint8(4), "200")) passCount++;
  total++; if (check("ArrayBuffer.isView", ArrayBuffer.isView(au8) + " " + ArrayBuffer.isView(abuf), "true false")) passCount++;

  // ---- 8i. Symbol 真实类型 + 知名符号 ----
  total++; if (check("typeof symbol", typeof Symbol("t"), "symbol")) passCount++;
  var as1 = Symbol("k"), as2 = Symbol("k");
  total++; if (check("symbol identity unique", as1 === as2, "false")) passCount++;
  total++; if (check("Symbol.for registry", Symbol.for("g") === Symbol.for("g"), "true")) passCount++;
  total++; if (check("symbol description", as1.description, "k")) passCount++;
  total++; if (check("symbol toString", String(Symbol("hi")), "Symbol(hi)")) passCount++;
  total++; if (check("Symbol.iterator identity", Symbol.iterator === Symbol.iterator, "true")) passCount++;
  total++; if (check("symbol key hidden", (function () {
    var o = { plain: 1 }; o[Symbol("s")] = 2; return Object.keys(o).length + ":" + JSON.stringify(o);
  })(), '1:{"plain":1}')) passCount++;
  total++; if (check("well-known iterator in use", typeof [][Symbol.iterator], "function")) passCount++;

  lines.unshift((passCount === total ? "PASS " : "FAIL ") + passCount + "/" + total + " checks");
  var cls = passCount === total ? "ok" : "fail";

  var el = document.getElementById("out");
  for (var li = 0; li < lines.length; li++) {
    var row = document.createElement("div");
    row.className = "row " + (li === 0 ? cls : "");
    row.textContent = lines[li];
    el.appendChild(row);
  }
  document.title = (passCount === total ? "PASS " : "FAIL ") + passCount + "/" + total;
</script>
</body>
</html>
